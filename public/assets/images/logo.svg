<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>FoodChooseApp</title>

  <!-- Fond brun arrondi avec dégradé -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3D1F10"/>
      <stop offset="100%" stop-color="#1E0E06"/>
    </linearGradient>
    <linearGradient id="plate" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#F07040"/>
      <stop offset="100%" stop-color="#D44B1A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Halo orange doux derrière l'assiette -->
  <circle cx="256" cy="268" r="185" fill="#E85A2A" opacity="0.18"/>

  <!-- Assiette (cercle principal) -->
  <circle cx="256" cy="268" r="158" fill="url(#plate)" filter="url(#shadow)"/>
  <!-- Rebord extérieur de l'assiette -->
  <circle cx="256" cy="268" r="158" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>
  <!-- Surface intérieure -->
  <circle cx="256" cy="268" r="122" fill="#E85A2A" opacity="0.35"/>

  <!-- FOURCHETTE — blanche, côté gauche -->
  <!-- Dent 1 -->
  <rect x="178" y="148" width="11" height="68" rx="5.5" fill="white"/>
  <!-- Dent 2 -->
  <rect x="198" y="142" width="11" height="74" rx="5.5" fill="white"/>
  <!-- Dent 3 -->
  <rect x="218" y="148" width="11" height="68" rx="5.5" fill="white"/>
  <!-- Pont des dents -->
  <path d="M 176 216 Q 178 244 203 250 Q 231 244 232 216" fill="white"/>
  <!-- Manche de la fourchette -->
  <rect x="196" y="250" width="15" height="140" rx="7.5" fill="white"/>

  <!-- COUTEAU — blanc, côté droit -->
  <!-- Lame -->
  <path d="M 283 142 C 310 142 326 168 322 204 L 322 222 L 298 222 L 298 142 Z" fill="white" opacity="0.95"/>
  <!-- Garde -->
  <rect x="294" y="218" width="18" height="10" rx="4" fill="rgba(255,255,255,0.7)"/>
  <!-- Manche du couteau -->
  <rect x="297" y="228" width="15" height="162" rx="7.5" fill="white"/>

  <!-- Lettres FC en bas, crème -->
  <text x="256" y="458"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="52"
        font-weight="700"
        font-style="italic"
        text-anchor="middle"
        fill="#FFF8F3"
        opacity="0.88"
        letter-spacing="4">FC</text>

</svg>
