<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>FoodChooseApp — Connexion Entreprise</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#E85A2A">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/assets/images/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FoodChooseApp">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="msapplication-TileImage" content="/assets/images/icon-144.png">
  <meta name="msapplication-TileColor" content="#2C1810">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--orange:#E85A2A;--brown:#2C1810;--cream:#FFF8F3;--muted:#8B6554;--border:#F0E6DE;--gold:#F9C74F;--success:#16a34a}
    html,body{min-height:100%}
    body{font-family:'DM Sans',sans-serif;background:var(--brown);display:flex;align-items:center;justify-content:center;padding:32px 20px;min-height:100vh}

    /* Background */
    .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 75% 25%,rgba(232,90,42,.18),transparent 55%),radial-gradient(ellipse at 25% 80%,rgba(249,199,79,.08),transparent 45%)}
    .grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,248,243,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,248,243,.025) 1px,transparent 1px);background-size:44px 44px}
    .orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(1px)}
    .orb-1{width:500px;height:500px;background:radial-gradient(circle,rgba(232,90,42,.09),transparent 70%);top:-150px;right:-150px;animation:orbF 22s ease-in-out infinite}
    .orb-2{width:320px;height:320px;background:radial-gradient(circle,rgba(249,199,79,.07),transparent 70%);bottom:-100px;left:-100px;animation:orbF 30s ease-in-out infinite reverse}
    @keyframes orbF{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,-22px)}}

    /* Card */
    .auth-card{position:relative;z-index:1;background:var(--cream);border-radius:28px;width:100%;max-width:440px;box-shadow:0 40px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.05);animation:cardIn .65s cubic-bezier(.16,1,.3,1) both;overflow:hidden}
    @keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

    /* Card top accent bar */
    .card-accent{height:4px;background:linear-gradient(90deg,var(--orange),var(--gold),var(--orange));background-size:200% 100%;animation:shimmer 3s linear infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    .card-inner{padding:36px 36px 32px}

    /* Header */
    .auth-header{text-align:center;margin-bottom:28px;animation:formIn .6s cubic-bezier(.16,1,.3,1) both}
    @keyframes formIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .auth-logo{width:56px;height:56px;border-radius:14px;margin:0 auto 12px;display:block;filter:drop-shadow(0 4px 12px rgba(232,90,42,.3))}
    .space-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(232,90,42,.12);color:var(--orange);font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:12px;border:1px solid rgba(232,90,42,.2);letter-spacing:.3px}
    .auth-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:var(--brown);line-height:1.2;margin-bottom:5px}
    .auth-sub{font-size:12.5px;color:var(--muted)}

    /* Form */
    .form-group{margin-bottom:16px;animation:formIn .6s cubic-bezier(.16,1,.3,1) both}
    .form-group:nth-child(1){animation-delay:.08s}
    .form-group:nth-child(2){animation-delay:.14s}
    .form-group label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--brown);margin-bottom:7px;letter-spacing:.3px}
    .form-group label svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .form-control{width:100%;padding:11px 14px;background:white;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--brown);transition:all .2s;outline:none}
    .form-control:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,90,42,.12)}
    .form-control::placeholder{color:#C4A898}
    .pw-wrap{position:relative}
    .pw-wrap .form-control{padding-right:44px}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:flex;align-items:center;justify-content:center;transition:color .2s}
    .pw-toggle:hover{color:var(--orange)}
    .pw-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* Button */
    .btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--orange),#D14D22);color:white;border:none;border-radius:11px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;margin-top:6px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(232,90,42,.3);animation:formIn .6s .22s both}
    .btn-submit::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transition:left .45s ease}
    .btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,90,42,.45)}
    .btn-submit:hover::before{left:100%}
    .btn-submit:disabled{opacity:.7;cursor:not-allowed;transform:none}
    .btn-submit svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

    /* Error */
    #errMsg{background:#FEE2E2;color:#991B1B;border-radius:10px;padding:11px 14px;font-size:13px;margin-top:10px;display:none;border:1px solid #FCA5A5;align-items:center;gap:8px}
    #errMsg.show{display:flex}
    #errMsg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

    /* Footer links */
    .auth-divider{border:none;border-top:1px solid var(--border);margin:20px 0}
    .auth-links{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;animation:formIn .6s .3s both}
    .auth-links a{font-size:12.5px;color:var(--muted);text-decoration:none;transition:color .2s}
    .auth-links a:hover{color:var(--orange)}
    .auth-register{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);animation:formIn .6s .35s both}
    .auth-register a{color:var(--orange);font-weight:600;text-decoration:none;margin-left:4px}
    .auth-register a:hover{text-decoration:underline}

    @media(max-width:480px){.card-inner{padding:28px 22px 26px}.auth-card{border-radius:22px}}
  </style>
</head>
<body>
<canvas id="particlesCanvas" style="position:fixed;inset:0;z-index:0;pointer-events:none"></canvas>
<div class="bg"></div><div class="grid"></div>
<div class="orb orb-1"></div><div class="orb orb-2"></div>
<div id="toastContainer"></div>

<div class="auth-card">
  <div class="card-accent"></div>
  <div class="card-inner">

    <!-- Header -->
    <div class="auth-header">
      <img src="/assets/images/logo.svg" alt="FoodChooseApp" class="auth-logo">
      <div class="space-badge">🏢 Espace Entreprise</div>
      <div class="auth-title">Connexion Entreprise</div>
      <div class="auth-sub">Accédez à votre espace de gestion des repas</div>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label>
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Adresse email
      </label>
      <input class="form-control" type="email" id="email" placeholder="contact@entreprise.com" autocomplete="email" onkeydown="if(event.key==='Enter')login()">
    </div>

    <!-- Password -->
    <div class="form-group">
      <label>
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Mot de passe
      </label>
      <div class="pw-wrap">
        <input class="form-control" type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
        <button class="pw-toggle" type="button" id="pwToggleBtn">
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-submit" id="loginBtn" onclick="login()">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Se connecter
    </button>

    <div id="errMsg">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errTxt"></span>
    </div>

    <hr class="auth-divider">
    <div class="auth-links">
      <a href="/">← Retour à l'accueil</a>
    </div>
    <p class="auth-register">
      Pas encore de compte ?
      <a href="/company/register">S'inscrire</a>
    </p>

  </div><!-- /card-inner -->
</div><!-- /auth-card -->

<script src="/assets/js/utils.js"></script>
<script>
// Redirect if already logged in as company
(function() {
  const token = localStorage.getItem('fc_token');
  const role  = localStorage.getItem('fc_role');
  if (token && role === 'company') {
    try {
      const exp = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp;
      if (exp * 1000 > Date.now()) { window.location.replace('/company/admin'); return; }
    } catch(e) {}
  }
})();

// Password toggle
document.getElementById('pwToggleBtn').addEventListener('click', function() {
  const inp = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  icon.innerHTML = show
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

async function login() {
  const email = document.getElementById('email').value.trim();
  const pwd   = document.getElementById('password').value;
  const err   = document.getElementById('errMsg');
  const errTxt = document.getElementById('errTxt');
  err.classList.remove('show');

  if (!email) { errTxt.textContent = 'Adresse email requise'; err.classList.add('show'); shakeEl(err); return; }
  if (!pwd)   { errTxt.textContent = 'Mot de passe requis';   err.classList.add('show'); shakeEl(err); return; }

  const btn = document.getElementById('loginBtn');
  setLoading(btn, 'Connexion...');
  try {
    const data = await apiFetch('/api/auth/company/login', {
      method: 'POST',
      body: JSON.stringify({ email, password: pwd })
    });
    localStorage.setItem('fc_token', data.token);
    localStorage.setItem('fc_role', 'company');
    localStorage.setItem('fc_name', data.name);
    localStorage.setItem('fc_id', data.id);
    localStorage.setItem('fc_co_token', data.token);

    btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg> Connexion réussie !';
    btn.style.background = 'var(--success)';
    btn.style.transform = 'scale(1.02)';
    setTimeout(() => window.location.href = '/company/admin', 600);
  } catch(e) {
    errTxt.textContent = e.message || 'Identifiants incorrects';
    err.classList.add('show');
    shakeEl(err);
    unsetLoading(btn, '<svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Se connecter');
  }
}

window.login = login;

// Particles
(function(){
  const canvas = document.getElementById('particlesCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for (let i = 0; i < 28; i++) particles.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.5 + .3,
    vx: (Math.random() - .5) * .2, vy: (Math.random() - .5) * .2,
    o: Math.random() * .08 + .02
  });
  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,248,243,${p.o})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

if (typeof initRipple === 'function') initRipple();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
