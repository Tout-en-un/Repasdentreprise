<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>FoodChooseApp — Hors ligne</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#E85A2A">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--orange:#E85A2A;--brown:#2C1810;--cream:#FFF8F3;--muted:#8B6554;--gold:#F9C74F}
    html,body{min-height:100%;height:100%}
    body{font-family:'DM Sans',sans-serif;background:var(--brown);display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;overflow:hidden}

    .bg{position:fixed;inset:0;z-index:0;
      background:radial-gradient(ellipse at 70% 20%,rgba(232,90,42,.15),transparent 55%),
                 radial-gradient(ellipse at 25% 85%,rgba(249,199,79,.07),transparent 45%)}
    .grid{position:fixed;inset:0;z-index:0;
      background-image:linear-gradient(rgba(255,248,243,.025) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(255,248,243,.025) 1px,transparent 1px);
      background-size:44px 44px}

    .card{position:relative;z-index:1;background:var(--cream);border-radius:28px;
      padding:48px 40px;text-align:center;max-width:420px;width:100%;
      box-shadow:0 40px 80px rgba(0,0,0,.4);
      animation:cardIn .6s cubic-bezier(.16,1,.3,1) both}
    @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

    .icon-wrap{width:90px;height:90px;border-radius:50%;
      background:linear-gradient(135deg,rgba(232,90,42,.15),rgba(249,199,79,.15));
      border:2px solid rgba(232,90,42,.2);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 24px;animation:pulse 2.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,90,42,.2)}50%{box-shadow:0 0 0 14px rgba(232,90,42,0)}}

    .icon-wrap svg{width:44px;height:44px;stroke:var(--orange);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

    h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;
      color:var(--brown);margin-bottom:10px}
    h1 span{color:var(--orange)}

    p{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:28px}

    .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;
      background:linear-gradient(135deg,var(--orange),#C94A1A);color:white;
      border:none;border-radius:11px;font-family:'DM Sans',sans-serif;
      font-size:14.5px;font-weight:600;cursor:pointer;
      box-shadow:0 4px 16px rgba(232,90,42,.3);
      transition:all .25s;text-decoration:none;margin-bottom:12px}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(232,90,42,.45)}
    .btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .hint{font-size:12px;color:var(--muted);margin-top:4px}

    .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;
      background:#FCA5A5;margin-right:6px;animation:blink 1.5s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    .online .status-dot{background:#86EFAC;animation:none}
    .status-line{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;margin-top:20px}
  </style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>

<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>

  <h1>Vous êtes <span>hors ligne</span></h1>
  <p>Vérifiez votre connexion internet.<br>
     Certaines données mises en cache restent<br>accessibles en mode hors ligne.</p>

  <button class="btn" onclick="retry()">
    <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Réessayer
  </button>
  <div class="hint">La page se rechargera automatiquement lorsque<br>la connexion sera rétablie.</div>

  <div class="status-line" id="statusLine">
    <span class="status-dot"></span> Connexion perdue
  </div>
</div>

<script>
function retry() {
  window.location.reload();
}

// Auto-retry when online
window.addEventListener('online', () => {
  const line = document.getElementById('statusLine');
  line.className = 'status-line online';
  line.innerHTML = '<span class="status-dot"></span> Connexion rétablie — rechargement...';
  setTimeout(() => window.history.back() || window.location.replace('/'), 800);
});

window.addEventListener('offline', () => {
  const line = document.getElementById('statusLine');
  line.className = 'status-line';
  line.innerHTML = '<span class="status-dot"></span> Connexion perdue';
});
</script>
</body>
</html>
